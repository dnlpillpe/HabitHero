name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión a publicar, por ejemplo v1.0.0'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  release:
    name: Publicar HabitHero
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Calcular la versión
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Preparar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generar el Gradle Wrapper si no está en el repositorio
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.9 --distribution-type bin
          fi
          chmod +x gradlew

      - name: Ejecutar las pruebas unitarias
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Compilar el APK de depuración
        run: ./gradlew assembleDebug --stacktrace

      - name: Renombrar el APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk \
             "release/HabitHero-${{ steps.version.outputs.tag }}.apk"
          ls -lh release

      - name: Publicar el Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: HabitHero ${{ steps.version.outputs.tag }}
          files: release/HabitHero-${{ steps.version.outputs.tag }}.apk
          body: |
            ## HabitHero ${{ steps.version.outputs.tag }}

            Aplicación Android para que niños de 8 a 12 años construyan hábitos diarios.

            **Instalación**
            1. Descarga el archivo `.apk` desde este Release.
            2. En el móvil, permite instalar aplicaciones de orígenes desconocidos.
            3. Abre el archivo descargado e instálalo.

            **Aviso**: es un APK de depuración, firmado con la clave de depuración de
            Android. Sirve para probar la app, no para publicarla en Google Play.

            Funciona sin internet, no pide permisos y no envía datos a ningún sitio.
